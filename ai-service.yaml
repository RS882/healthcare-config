server:
  port: 8087
  address: 0.0.0.0
  forward-headers-strategy: framework

  servlet:
    context-path: /api

spring:
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

      chat:
        options:
          model: ${AI_MODEL:llama3:latest}

  data:
    mongodb:
      uri: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DATABASE}?authSource=${MONGO_AUTH_DATABASE}

    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  cache:
    type: redis

  spring:
    cloud:
      config:
        fail-fast: true
        retry:
          initial-interval: 2000
          max-attempts: 10
          multiplier: 1.5

      discovery:
        enabled: true

      openfeign:
        circuitbreaker:
          enabled: true

        client:
          config:
            default:
              connect-timeout: 2000
              read-timeout: 3000
              logger-level: basic

            userAuthInfoClient:
              connect-timeout: 1000
              read-timeout: 2000
              logger-level: basic

ai:
  provider: ${AI_PROVIDER:ollama}
  model: ${AI_MODEL:llama3:latest}

  prompt:
    activation-retry:
      max-attempts: 3
      initial-delay: 50ms
      multiplier: 2.0
      max-delay: 300ms

cache:
  default-ttl: 30m

  active-prompt:
    ttl: 1h

  user-auth-info:
    ttl: 30s

request-id:
  prefix: ${REQUEST_ID_PREFIX:request-id:}
  ttl: ${REQUEST_ID_TTL:30s}
  value: ${AI_SERVICE_REQUEST_ID_VALUE:ai-service}

header-request-id:
  name: ${HEADER_REQUEST_ID_NAME:X-Request-Id}

user-context:
  userContextHeader: ${USER_CONTEXT_HEADER:X-User-Context}

security:
  user-context:
    issuer: api-gateway
    key-id: gateway-key-1
    public-key-pem: ${USER_CONTEXT_PUBLIC_KEY_PEM:}
    public-key-path: ${USER_CONTEXT_PUBLIC_KEY_PATH:./secrets/gateway-user-context-public.pem}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: false
    hostname: host.docker.internal
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true