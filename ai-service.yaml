server:
  port: 8087
  forward-headers-strategy: framework
  servlet:
    context-path: /api
#spring:
#  ai:
#    openai:
#      api-key: ${OPENAI_API_KEY}
#      chat:
#        options:
#          model: gpt-4o-mini

spring:
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL}
      chat:
        options:
          model: ${ai.model}

  data:
    mongodb:
      uri: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DATABASE}?authSource=${MONGO_AUTH_DATABASE}

    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2s

  cache:
    type: redis

ai:
  provider: ${AI_PROVIDER}
  model: ${AI_MODEL}

cache:
  default-ttl: 30m

  active-prompt:
    cache-name: active-prompts
    ttl: 1h

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA}
    register-with-eureka: true
    fetch-registry: true
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
#    enabled: false  # Swagger UI отображается только через gateway