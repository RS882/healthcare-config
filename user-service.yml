server:
  port: 8082
  forward-headers-strategy: framework
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://${DB}?serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml

  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 2000
        max-attempts: 10
        multiplier: 1.5

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    admin:
      fail-fast: false

app:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    topics:
      user-registered:
        name: ${USER_REGISTERED_TOPIC:user.registered.v1}
        partitions: ${USER_REGISTERED_PARTITIONS:3}
        replicas: ${USER_REGISTERED_REPLICAS:1}

      user-updated:
        name: ${USER_UPDATED_TOPIC:user.updated.v1}
        partitions: ${USER_UPDATED_PARTITIONS:3}
        replicas: ${USER_UPDATED_REPLICAS:1}

      user-deleted:
        name: ${USER_DELETED_TOPIC:user.deleted.v1}
        partitions: ${USER_DELETED_PARTITIONS:3}
        replicas: ${USER_DELETED_REPLICAS:1}

      notification-email-requested:
        name: ${NOTIFICATION_EMAIL_REQUESTED_TOPIC:notification.email.requested.v1}
        partitions: ${NOTIFICATION_EMAIL_REQUESTED_PARTITIONS:3}
        replicas: ${NOTIFICATION_EMAIL_REQUESTED_REPLICAS:1}
    groups:
      user-service:
        id: ${USER_REGISTERED_GROUP_ID:user-service-group}
    producer:
      transaction-id-prefix: user-service-tx-
      properties:
        enable.idempotence: true
        acks: all

  outbox:
    cleanup:
      cron: "0 0 3 * * *"
      retention-days: 7
    recovery:
      cron: "0 */5 * * * *"
      timeout-minutes: 15

  processed-event:
    cleanup:
      cron: "0 30 3 * * *"
      retention-days: 30

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: false
    hostname: ${HOSTNAME:${spring.application.name}}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
  api-docs:
    path: /v3/api-docs

cors:
  allowed-origins: ${ALLOWED_ORIGINS}

request-id:
  prefix: ${REQUEST_ID_PREFIX:request-id:}
  ttl: ${REQUEST_ID_TTL:30s}
  value: ${USER_SERVICE_REQUEST_ID_VALUE:user-service}

header-request-id:
  name: ${HEADER_REQUEST_ID_NAME:X-Request-Id}

user-context:
  userContextHeader: ${USER_CONTEXT_HEADER:X-User-Context}

security:
  user-context:
    issuer: api-gateway
    key-id: gateway-key-1
    public-key-pem: ${USER_CONTEXT_PUBLIC_KEY_PEM:}
    public-key-path: ${USER_CONTEXT_PUBLIC_KEY_PATH:./secrets/gateway-user-context-public.pem}

